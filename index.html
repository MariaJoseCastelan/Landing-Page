<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segunda Vuelta - Landing Page</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fuente de texto (Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!--Aquí esta el header/menú de navegación -->
    <header class="encabezado">
    <div class="contenedor-encabezado">
      
      <!-- Logo del proyecto aquí -->
      <div class="caja-logo">
        <div class="icono-logo">
          <!-- Aquí la imagen para el logo del proyecto -->
        <!-- Alt describe la imagen por si la imagen no se carga, entonces el navegador mostrará el texto 'Ícono Segunda Vuelta'. -->
          <img src="" alt="Ícono Segunda Vuelta" class="imagen-icono-logo">
        </div>
        <span>Segunda Vuelta</span>
      </div>

      <!-- Enlaces de navegación para ir a las otras páginas -->
      <nav class="navegacion-principal">
        <a href="#" class="enlace-navegacion activo">Inicio</a>
        <a href="#" class="enlace-navegacion">Sobre Nosotros</a>
        <a href="#" class="enlace-navegacion">¿Qué nos destaca?</a>
        <a href="#" class="enlace-navegacion">¿Cómo contactarnos?</a>
      </nav>
      
    </div>
  </header>
    
</body>
</html>
